name: ESP-IDF 5.5 - Module 6.1
on:
  push:
    branches:
      - hw/6.1-rtos-esp-idf
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build ESP32-S3 firmware
        run: |
          source /opt/esp/idf/export.sh
          idf.py --version
          idf.py set-target esp32s3
          idf.py build
